[notification]
background_opacity = 0.69999998435378075
offset_y = 20

[osd]
background_opacity = 0.69999998435378075
offset_y = 20

[shell]
corner_radius_scale = 0.40000000596046448
font_family = "Maple Mono"
polkit_agent = true

    [shell.launcher]
    categories = false
    compact = true
    show_app_origin_indicator = false
    sort_by_usage = false

        [shell.launcher.providers.calculator]
        prefix = "c"

        [shell.launcher.providers.emoji]
        prefix = "e"

        [shell.launcher.providers.session]
        prefix = "s"

        [shell.launcher.providers.wallpaper]
        prefix = "w"

        [shell.launcher.providers.windows]
        prefix = "wd"

    [shell.panel]
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
community_palette = "Monochrome"
custom_palette = "Monochrome Custom"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/tema/.config/Wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "~/.config/Wallpapers/wallhaven-1qdjv1.jpg"

    [wallpaper.last]
    path = "~/.config/Wallpapers/wallhaven-1qdjv1.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/.config/Wallpapers/wallhaven-1qdjv1.jpg"

[weather]
refresh_minutes = 15

[widget.battery]
show_label = false

[widget.clock.actions]
left = "panel-toggle control-center"

[widget.keyboard_layout]
show_glyph = false

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces]
label_source = "name"
labels_only_when_occupied = true
max_label_chars = 20
