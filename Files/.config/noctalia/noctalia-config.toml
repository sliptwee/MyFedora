[backdrop]
blur_intensity = 0.79999998211860657
enabled = true
tint_intensity = 0.0

[bar.default]
background_opacity = 0.69999998435378075
capsule_radius = 4
capsule_thickness = 0.74999998696148396
end = [ "tray", "battery", "network", "volume", "clipboard", "keyboard_layout" ]
font_weight = 700
margin_ends = 0
padding = 5
panel_overlap = 0
radius = 0
start = [ "workspaces" ]
thickness = 26
widget_spacing = 12

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "media", "power", "network", "bluetooth", "weather", "screen-time" ]
show_shortcut_labels = false

[desktop_widgets]
enabled = false

[idle]
pre_action_fade_seconds = 0

[lockscreen]
blur_intensity = 0.99999997764825821
tint_intensity = 0.44999998994171619

[lockscreen_widgets]
